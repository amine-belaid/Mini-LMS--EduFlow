<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Tableau de bord sur EduFlow, plateforme d’apprentissage.">
        <title>Tableau de bord — EduFlow</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/homepage.css">
        <link rel="stylesheet" href="css/app.css">
        <link rel="stylesheet" href="css/dashboard.css">
        <link rel="stylesheet" href="css/responsive.css">
        <script src="js/data.js" defer>
        </script>
        <script src="js/storage.js" defer>
        </script>
        <script src="js/ui.js" defer>
        </script>
        <script src="js/main.js" defer>
        </script>
        <script src="js/dashboard.js" defer>
        </script>
    </head>
    <body>
        <a class="skip-link" href="#contenu-principal">Aller au contenu principal</a>
        <header class="site-header">
            <a href="index.html" class="site-logo" aria-label="EduFlow — Accueil">
                <img src="assets/icons/logo.png" alt="EduFlow" width="180" height="60">
            </a>
            <nav class="main-nav" aria-label="Navigation principale">
                <ul class="nav-list">
                    <li>
                        <a href="index.html">Accueil</a>
                    </li>
                    <li>
                        <a href="courses.html" class="nav-section-active">Cours</a>
                    </li>
                </ul>
            </nav>
            <form class="header-search" role="search" action="courses.html" method="get">
                <label for="course-search" class="visually-hidden">Rechercher un cours</label>
                <input type="search" id="course-search" name="q" placeholder="Rechercher un cours, une leçon...">
                <button type="submit">Rechercher</button>
            </form>
            <div class="header-actions">
                <button type="button" class="notification-button" aria-label="Consulter les notifications">
                    <span aria-hidden="true">🔔</span>
                </button>
                <a href="dashboard.html" class="profile-link" aria-label="Mon tableau de bord">
                    <span aria-hidden="true">A</span>
                </a>
            </div>
        </header>
        <main id="contenu-principal" class="app-container">
            <div class="dashboard-layout">
                <aside class="app-panel dashboard-nav">
                    <h2>Mon espace</h2>
                    <a href="dashboard.html" aria-current="page">Tableau de bord</a>
                    <a href="courses.html">Explorer les cours</a>
                    <a href="index.html">Accueil</a>
                </aside>
                <div>
                    <section class="app-banner">
                        <h1>Bonjour </h1>
                        <p>Voici un aperçu de votre parcours d’apprentissage.</p>
                        <div id="stats" class="dashboard-stats">
                        </div>
                    </section>
                    <p id="feedback" class="app-status" role="status">
                    </p>
                    <section>
                        <div class="results-heading">
                            <h2 id="courses-heading">Mes cours</h2>
                            <label>Afficher <select id="view" class="app-input">
                                    <option value="enrolled">Cours inscrits</option>
                                    <option value="favorites">Favoris</option>
                                    <option value="completed">Cours terminés</option>
                                </select>
                            </label>
                        </div>
                        <div id="my-courses" class="course-grid">
                        </div>
                    </section>
                    <section class="app-panel activity-panel">
                        <h2>Mes dernières activités</h2>
                        <ul id="activities">
                        </ul>
                    </section>
                </div>
                <aside>
                    <section class="app-panel">
                        <h2>Ma progression globale</h2>
                        <div id="global-progress" class="progress-ring">
                            <strong id="global-percent">0%</strong>
                        </div>
                        <p id="global-description">
                        </p>
                    </section>
                    <section class="app-panel">
                        <h2>Mon objectif</h2>
                        <form id="goal-form">
                            <label for="goal">Cours à terminer</label>
                            <input id="goal" class="app-input" type="number" min="1" max="50" required value="2">
                            <button class="button button-outline" type="submit">Enregistrer</button>
                        </form>
                        <p id="goal-label">
                        </p>
                        <progress id="goal-progress" class="card-progress" aria-label="Objectif de cours terminés">
                        </progress>
                    </section>
                </aside>
            </div>
            <noscript>Activez JavaScript pour afficher votre progression.</noscript>
        </main>
        <footer class="app-footer">EduFlow · Apprenez à votre rythme · <a href="index.html">Accueil</a>
        </footer>
    </body>
</html>
