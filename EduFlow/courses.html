<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Nos cours sur EduFlow, plateforme d’apprentissage.">
        <title>Nos cours — EduFlow</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/homepage.css">
        <link rel="stylesheet" href="css/app.css">
        <link rel="stylesheet" href="css/courses.css">
        <link rel="stylesheet" href="css/responsive.css">
        <script src="js/data.js" defer>
        </script>
        <script src="js/storage.js" defer>
        </script>
        <script src="js/ui.js" defer>
        </script>
        <script src="js/main.js" defer>
        </script>
        <script src="js/courses.js" defer>
        </script>
    </head>
    <body>
        <a class="skip-link" href="#contenu-principal">Aller au contenu principal</a>
        <header class="site-header">
            <a href="index.html" class="site-logo" aria-label="EduFlow — Accueil">
                <img src="assets/icons/logo.png" alt="EduFlow" width="180" height="60">
            </a>
            <nav class="main-nav" aria-label="Navigation principale">
                <ul class="nav-list">
                    <li>
                        <a href="index.html">Accueil</a>
                    </li>
                    <li>
                        <a href="courses.html" class="nav-section-active">Cours</a>
                    </li>
                </ul>
            </nav>
            <form class="header-search" role="search" action="courses.html" method="get">
                <label for="course-search" class="visually-hidden">Rechercher un cours</label>
                <input type="search" id="course-search" name="q" placeholder="Rechercher un cours, une leçon...">
                <button type="submit">Rechercher</button>
            </form>
            <div class="header-actions">
                <button type="button" class="notification-button" aria-label="Consulter les notifications">
                    <span aria-hidden="true">🔔</span>
                </button>
                <a href="dashboard.html" class="profile-link" aria-label="Mon tableau de bord">
                    <span aria-hidden="true">A</span>
                </a>
            </div>
        </header>
        <main id="contenu-principal" class="app-container">
            <section class="app-banner">
                <h1>Nos cours</h1>
                <p>Découvrez les cours pour développer vos compétences et atteindre vos objectifs.</p>
            </section>
            <p id="feedback" class="app-status" role="status">
            </p>
            <div class="catalog-layout">
                <form id="filters" class="app-panel">
                    <h2>Rechercher</h2>
                    <label for="query">Nom du cours</label>
                    <input class="app-input" id="query" type="search" placeholder="Nom, compétence…">
                    <label for="category">Catégorie</label>
                    <select class="app-input" id="category">
                        <option value="">Toutes les catégories</option>
                    </select>
                    <label for="level">Niveau</label>
                    <select class="app-input" id="level">
                        <option value="">Tous les niveaux</option>
                        <option>Débutant</option>
                        <option>Intermédiaire</option>
                        <option>Avancé</option>
                    </select>
                    <label for="duration">Durée</label>
                    <select class="app-input" id="duration">
                        <option value="">Toutes les durées</option>
                        <option value="short">Moins de 4 heures</option>
                        <option value="long">4 heures et plus</option>
                    </select>
                    <label class="favorites-filter">
                        <input id="favorites-only" type="checkbox"> Mes favoris</label>
                    <button class="button button-outline" type="reset">Réinitialiser</button>
                </form>
                <section aria-label="Résultats">
                    <div class="results-heading">
                        <h2 id="result-count" aria-live="polite">Cours disponibles</h2>
                        <label>Trier par <select class="app-input" id="sort">
                                <option value="popular">Plus populaires</option>
                                <option value="title">Nom du cours</option>
                                <option value="duration">Durée croissante</option>
                            </select>
                        </label>
                    </div>
                    <div id="results" class="course-grid">
                    </div>
                    <noscript>Activez JavaScript pour rechercher et afficher les cours.</noscript>
                </section>
            </div>
        </main>
        <footer class="app-footer">EduFlow · Apprenez à votre rythme · <a href="index.html">Accueil</a>
        </footer>
    </body>
</html>
